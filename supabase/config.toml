# Minimal Supabase CLI config. `supabase link --project-ref <ref>` connects it to your project,
# `supabase db push --include-seed` applies migrations and the seed files below.
project_id = "puropesu"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seeds/postal_codes.sql"]
